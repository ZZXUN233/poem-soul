# ============================================
# peom-soul (诗魂) 服务编排
# 宿主 3006 -> 容器 3000（ai-hotbed/demos 占 3005，故本服务用 3006）
# 镜像默认 localhost:5000/peom-soul:latest，可通过 build 参数覆盖
# .env 非必须（无数据库）；不存在则按默认启动
# ============================================
services:
  peom-soul:
    image: localhost:5000/peom-soul:latest
    container_name: peom-soul
    ports:
      - "${PEOM_PORT:-3006}:3000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/random"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
