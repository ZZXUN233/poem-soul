# ============================================
# ps.zzxun.cn — peom-soul（诗魂）古诗词阅读应用
# 后端: 127.0.0.1:3006 (容器内部 3000)
#
# 部署方式:
#   1. 将此文件复制到 /etc/nginx/sites-enabled/ps
#      (scp nginx/ps.conf root@ps.zzxun.cn:/etc/nginx/sites-enabled/ps)
#   2. nginx -t && nginx -s reload
#
# SSL: 复用 ai-hotbed 的 Let's Encrypt 泛域名证书 (*.zzxun.cn，acme.sh 自动续期)
# ============================================

# ── HTTP → HTTPS 强制跳转 ─────────────────────────────────
server {
    listen 80;
    server_name ps.zzxun.cn;

    # Let's Encrypt HTTP-01 验证豁免
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS 主站 ────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name ps.zzxun.cn;

    # Let's Encrypt 泛域名证书 — 由 acme.sh 自动管理
    ssl_certificate     /etc/nginx/certs/acme/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/acme/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   off;
    server_tokens       off;

    # 安全响应头（全局默认）
    add_header Strict-Transport-Security "max-age=31536000;includeSubDomains;preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https:; connect-src 'self' https:; img-src 'self' data: https: blob:; style-src 'unsafe-inline' https:; font-src https:; frame-src 'self' https: blob:;" always;

    # 请求体上限
    client_max_body_size 20M;

    access_log /var/log/nginx/ps.access.log;
    error_log  /var/log/nginx/ps.error.log;

    # API 接口
    location /api/ {
        proxy_pass http://127.0.0.1:3006/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_redirect off;
        client_max_body_size 20M;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
    }

    # 静态资源 — Next.js 构建产物（带 hash，长缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 页面路由 — Next.js 页面（默认禁止被 iframe 嵌入）
    location / {
        proxy_pass http://127.0.0.1:3006;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_redirect off;
        client_max_body_size 20M;

        # 页面禁止被 iframe 嵌入
        add_header X-Frame-Options "DENY" always;
    }
}
